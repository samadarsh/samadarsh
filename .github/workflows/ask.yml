name: Ask Adarsh

on:
  issues:
    types: [opened]
  # Re-answer a question that failed, e.g. when the free model quota ran out.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to answer
        required: true

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: ask-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  answer:
    # startsWith is case-insensitive, so "ask:" and "Ask:" both count.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'ask:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Answer the question
        run: python3 .github/scripts/ask_agent.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional fallbacks: add either as a repository secret to use your own key.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
