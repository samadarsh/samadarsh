<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Adarsh, AI Engineer. Don't read about my work. Ask it. Ask a question about my work."><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.g1{animation:d1 16s ease-in-out infinite alternate}.g2{animation:d2 19s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(110px,30px)}}@keyframes d2{to{transform:translate(-120px,-30px)}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.g1,.g2,.cur{animation:none}}</style><defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter><clipPath id="clip"><rect width="860" height="300" rx="14"/></clipPath></defs><g clip-path="url(#clip)"><rect width="860" height="300" fill="#0d1117"/><ellipse class="g1" cx="300" cy="120" rx="230" ry="110" fill="#f0883e" opacity=".36" filter="url(#blur)"/><ellipse class="g2" cx="600" cy="190" rx="200" ry="90" fill="#f0883e" opacity=".24" filter="url(#blur)"/></g><rect x=".5" y=".5" width="859" height="299" rx="14" fill="none" stroke="#30363d"/><text x="430.0" y="58" font-size="15" text-anchor="middle" fill="#9198a1"><tspan font-weight="600" fill="#e6edf3">Adarsh</tspan> · AI Engineer</text><text x="430.0" y="112" font-size="38" font-weight="700" letter-spacing="-.6" text-anchor="middle" fill="#e6edf3">Don't read about my work.</text><text x="430.0" y="158" font-size="38" font-weight="700" letter-spacing="-.6" text-anchor="middle" fill="#f0883e">Ask it.</text><rect x="116.0" y="192" width="628" height="60" rx="15" fill="#f0883e" fill-opacity=".12"/><rect x="120.0" y="196" width="620" height="52" rx="12" fill="#0d1117" stroke="#f0883e"/><text x="138.0" y="228" font-size="15" class="mono" fill="#9198